<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d71920">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Prospector Bresler</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="icon-192.png?v=3">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="toast" class="toast"></div>
  <main id="app" class="app-shell">
    <div class="splash">
      <img src="logo-bresler.png?v=3" alt="Bresler">
      <div class="spinner"></div>
      <p style="font-family:Arial,sans-serif;color:#657084">Iniciando aplicación…</p>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }
    if ('caches' in window) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  </script>
  <script type="module">
    const app = document.getElementById('app');
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      window.supabase = { createClient: mod.createClient };
      await import('./config.js?v=3');
      await import('./app.js?v=3');
    } catch (err) {
      console.error(err);
      app.innerHTML = `
        <section class="login">
          <div class="login-card">
            <div class="brand">
              <img src="logo-bresler.png?v=3" alt="Bresler">
              <h1>Prospección Bresler</h1>
              <p>No fue posible iniciar la aplicación.</p>
            </div>
            <div class="card">
              <b>Error de inicio</b>
              <div class="meta" style="word-break:break-word">${String(err?.message || err)}</div>
            </div>
            <button class="btn btn-primary" onclick="location.reload()">REINTENTAR</button>
          </div>
        </section>`;
    }
  </script>
</body>
</html>
